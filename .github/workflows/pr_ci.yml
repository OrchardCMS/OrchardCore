name: PR - CI
on: 
  pull_request:
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PLAYWRIGHT_TRACING: true
permissions:
  contents: read
jobs:
  build_test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    name: Build & Test
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Pin global.json SDK in CI
      shell: pwsh
      run: |
        $globalJson = Get-Content global.json -Raw | ConvertFrom-Json
        $version = $globalJson.sdk.version
        $globalJson.sdk.PSObject.Properties.Remove('rollForward')
        $globalJson | ConvertTo-Json -Depth 10 | Set-Content global.json
        Write-Host "Pinned global.json SDK for CI: $version"
    - uses: ./.github/actions/setup-dotnet
    - name: Verify exact .NET SDK from global.json
      shell: pwsh
      run: |
        $expected = (Get-Content global.json | ConvertFrom-Json).sdk.version
        $actual = dotnet --version
        Write-Host "Expected SDK: $expected"
        Write-Host "Actual SDK:   $actual"
        if ($actual -ne $expected) {
          Write-Error "CI must use exact SDK version from global.json."
          exit 1
        }
    - name: Build
      # We disable NuGet audit warnings, see https://learn.microsoft.com/en-us/nuget/reference/errors-and-warnings/nu1901-nu1904.
      # Security issues being discovered in NuGet packages we use can happen at any time, and thus all our CI builds that
      # treat warnings as errors could break anytime, without us changing the code. This prevents that. Treating them as
      # warnings and other better approaches don't work, see https://github.com/OrchardCMS/OrchardCore/pull/16317.
      run: |
        dotnet build -c Release -p:TreatWarningsAsErrors=true --warnaserror -p:RunAnalyzers=true -p:NuGetAudit=false
    - name: Unit Tests
      run: |
        dotnet test --project ./test/OrchardCore.Tests/OrchardCore.Tests.csproj -c Release --no-build
    - name: Cache Playwright Browsers
      if: matrix.os == 'ubuntu-24.04'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ hashFiles('Directory.Packages.props') }}
    - name: Install Playwright Browsers
      if: matrix.os == 'ubuntu-24.04'
      run: |
        pwsh test/OrchardCore.Tests.Functional/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
    - name: Functional Tests - CMS
      if: matrix.os == 'ubuntu-24.04'
      run: |
        dotnet test --project test/OrchardCore.Tests.Functional/OrchardCore.Tests.Functional.csproj -c Release --no-build --filter-class "*Cms*"
    - name: Functional Tests - MVC
      if: matrix.os == 'ubuntu-24.04'
      env:
        # The MVC app uses neither Redis nor Azurite; don't start those containers for this run.
        ORCHARD_TEST_DOCKER_SERVICES: "false"
      run: |
        dotnet test --project test/OrchardCore.Tests.Functional/OrchardCore.Tests.Functional.csproj -c Release --no-build --filter-class "*Mvc*"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: matrix.os == 'ubuntu-24.04' && failure()
      with:
        name: functional-test-failure
        path: |
          src/OrchardCore.Cms.Web/App_Data_Tests_*/logs
          test/OrchardCore.Tests.Functional/traces
        retention-days: 3
