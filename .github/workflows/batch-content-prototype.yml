name: Batch Content Prototype Validation

on:
  push:
    branches:
      - feature/10231-batch-content-creation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - name: Compile Orchard Core tests
        run: dotnet build ./test/OrchardCore.Tests/OrchardCore.Tests.csproj -c Release -p:NuGetAudit=false
      - name: Run batch creation unit tests
        run: dotnet test --project ./test/OrchardCore.Tests/OrchardCore.Tests.csproj -c Release --no-build --filter-class "*BatchControllerTests"
