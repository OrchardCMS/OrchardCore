name: Integration Tests

on:
  # Manual trigger.
  workflow_dispatch:
  pull_request_review:
    types: [submitted]
  # Run it on main and release pushes too, in case we merge from a branch that's not up-to-date with the target branch
  # and breaks something after merge (or if we push to main).
  push:
    paths-ignore:
      - '**/*.md'
      - 'mkdocs.yml'
      - 'src/docs/**/*'
    branches: [ main, release/** ]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: read

jobs:
  test:
    name: Integration Tests
    if: github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        github.event.review.state == 'APPROVED' ||
        github.event.review.state == 'CHANGES_REQUESTED'
    # The hosted Ubuntu runners include a running Docker engine, which Testcontainers uses
    # to start the LocalStack (S3) and Azurite (Azure Blob) emulators automatically.
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Pin global.json SDK in CI
      shell: pwsh
      run: |
        $globalJson = Get-Content global.json -Raw | ConvertFrom-Json
        $version = $globalJson.sdk.version
        $globalJson.sdk.PSObject.Properties.Remove('rollForward')
        $globalJson | ConvertTo-Json -Depth 10 | Set-Content global.json
        Write-Host "Pinned global.json SDK for CI: $version"
    - uses: ./.github/actions/setup-dotnet
    - name: Verify exact .NET SDK from global.json
      shell: pwsh
      run: |
        $expected = (Get-Content global.json | ConvertFrom-Json).sdk.version
        $actual = dotnet --version
        Write-Host "Expected SDK: $expected"
        Write-Host "Actual SDK:   $actual"
        if ($actual -ne $expected) {
          Write-Error "CI must use exact SDK version from global.json."
          exit 1
        }
    - name: Build
      run: |
        dotnet build ./test/OrchardCore.Tests.Integration/OrchardCore.Tests.Integration.csproj -c Release /p:NuGetAudit=false
    - name: Integration Tests
      # The externally configured Gen1/Gen2 tests run in test_azure_blob instead.
      run: |
        dotnet test --project ./test/OrchardCore.Tests.Integration/OrchardCore.Tests.Integration.csproj -c Release --no-build --filter-not-class "OrchardCore.Tests.Integration.AzureBlob.*" --filter-not-class "OrchardCore.Tests.Integration.MediaAzure.*"
  test_azure_blob:
    name: Integration Tests - Azure Blob Storage (Azurite)
    if: github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        github.event.review.state == 'APPROVED' ||
        github.event.review.state == 'CHANGES_REQUESTED'
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Pin global.json SDK in CI
      shell: pwsh
      run: |
        $globalJson = Get-Content global.json -Raw | ConvertFrom-Json
        $version = $globalJson.sdk.version
        $globalJson.sdk.PSObject.Properties.Remove('rollForward')
        $globalJson | ConvertTo-Json -Depth 10 | Set-Content global.json
        Write-Host "Pinned global.json SDK for CI: $version"
    - uses: ./.github/actions/setup-dotnet
    - name: Verify exact .NET SDK from global.json
      shell: pwsh
      run: |
        $expected = (Get-Content global.json | ConvertFrom-Json).sdk.version
        $actual = dotnet --version
        Write-Host "Expected SDK: $expected"
        Write-Host "Actual SDK:   $actual"
        if ($actual -ne $expected) {
          Write-Error "CI must use exact SDK version from global.json."
          exit 1
        }
    - name: Build
      run: |
        dotnet build -c Release ./test/OrchardCore.Tests.Integration/OrchardCore.Tests.Integration.csproj /p:NuGetAudit=false
    - name: Start Azurite
      run: |
        docker run -d --name azurite -p 10000:10000 ghcr.io/skrypt/azurite-adls-gen2@sha256:39a3382dbf13aaa93d10515d4f3c6f994bb62f96c5b095d158d4ec367f2de7a4 azurite --blobHost 0.0.0.0 --skipApiVersionCheck --enableHierarchicalNamespace=true
    - name: Azure Blob Integration Tests
      env:
        AZURITE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
      run: |
        dotnet test --project ./test/OrchardCore.Tests.Integration/OrchardCore.Tests.Integration.csproj -c Release --no-build --filter-class "OrchardCore.Tests.Integration.AzureBlob.*" --filter-class "OrchardCore.Tests.Integration.MediaAzure.*"
