name: Release - CI
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'mkdocs.yml'
      - 'src/docs/**/*'
    tags: 
      - 'v*.*.*'

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - id: version
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
  native:
    needs: version
    uses: ./.github/workflows/remote_cli.yml
    with:
      version: ${{ needs.version.outputs.version }}
  test:
    needs: native
    runs-on: ${{ matrix.os }}
    name: Build, Test, Deploy
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
    - name: Get the version
      id: get_version
      run: |
          # Strip leading 'v' if present
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-dotnet
    - name: Set build number 
      if: matrix.os == 'ubuntu-24.04'
      run: echo "BuildNumber=$(( GITHUB_RUN_NUMBER + 15471 ))" >> "$GITHUB_ENV"
    - name: Build
      # NuGetAudit is intentionally not disabled here like it is for other CI builds, because we need to address any
      # vulnerable packages before releasing a new version.
      run: |
        dotnet build -c Release -p:TreatWarningsAsErrors=true --warnaserror -p:RunAnalyzers=true -p:Version=${{ steps.get_version.outputs.VERSION }}
    - name: Unit Tests
      run: |
        dotnet test --project ./test/OrchardCore.Tests/OrchardCore.Tests.csproj -c Release --no-build
        dotnet test --project test/OrchardCore.Cli.Tests -c Release --no-build
        dotnet test --project test/OrchardCore.RemoteManagement.Tests -c Release --no-build
    - name: Cache Playwright Browsers
      if: matrix.os == 'ubuntu-24.04'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ hashFiles('Directory.Packages.props') }}
    - name: Install Playwright Browsers
      if: matrix.os == 'ubuntu-24.04'
      run: |
        pwsh test/OrchardCore.Tests.Functional/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
    - name: Functional Tests - CMS
      if: matrix.os == 'ubuntu-24.04'
      run: |
        dotnet test --project test/OrchardCore.Tests.Functional/OrchardCore.Tests.Functional.csproj -c Release --no-build --filter-class "*Cms*"
    - name: Functional Tests - MVC
      if: matrix.os == 'ubuntu-24.04'
      env:
        # The MVC app uses neither Redis nor Azurite; don't start those containers for this run.
        ORCHARD_TEST_DOCKER_SERVICES: "false"
      run: |
        dotnet test --project test/OrchardCore.Tests.Functional/OrchardCore.Tests.Functional.csproj -c Release --no-build --filter-class "*Mvc*"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: matrix.os == 'ubuntu-24.04' && failure()
      with:
        name: Functional Test failure
        path: |
          src/OrchardCore.Cms.Web/App_Data_Tests_*/logs
          src/OrchardCore.Mvc.Web/App_Data_Tests/logs
          test/OrchardCore.Tests.Functional/traces
        retention-days: 3
    - name: Download native tool packages
      if: matrix.os == 'ubuntu-24.04'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: pomi-tool-*
        path: src/native-tool-packages
    - name: Validate publication tooling
      if: matrix.os == 'ubuntu-24.04'
      run: python3 .scripts/remote-management/test-prepare-packages.py
    - name: NuGet login
      if: matrix.os == 'ubuntu-24.04'  
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
      with:
        user: Orchard        
    - name: Deploy release NuGet packages
      if: matrix.os == 'ubuntu-24.04'
      run: |
        dotnet pack -c Release --no-build -p:Version=${{ steps.get_version.outputs.VERSION }} -p:TreatWarningsAsErrors=false
        python3 .scripts/remote-management/prepare-packages.py src artifacts/packages "${{ steps.get_version.outputs.VERSION }}"
        while IFS= read -r package; do
          dotnet nuget push "$package" -t 600 --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json --skip-duplicate
        done < artifacts/packages/publish-order.txt
    - name: Set up Docker Buildx
      if: matrix.os == 'ubuntu-24.04'
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
    - name: Login to DockerHub
      if: matrix.os == 'ubuntu-24.04'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
    - name: Deploy release docker images
      if: matrix.os == 'ubuntu-24.04'
      shell: pwsh
      run: |
        Get-ChildItem ./src/OrchardCore.Cms.Web/App_Data -Recurse | Remove-Item -Recurse -Confirm:$false
        Get-ChildItem ./src/OrchardCore.Cms.Web/App_Data_Tests_* -Recurse | Remove-Item -Recurse -Confirm:$false
        $output = [System.IO.Path]::GetFullPath("./.build/release")
        dotnet publish src/OrchardCore.Cms.Web/OrchardCore.Cms.Web.csproj -c Release --property:PublishDir=$output --no-build --framework net10.0
        docker buildx build -f Dockerfile-CI --platform=linux/amd64 -t orchardproject/orchardcore-cms-linux:latest -t orchardproject/orchardcore-cms-linux:${{ steps.get_version.outputs.VERSION }} --push .
        docker buildx build -f Dockerfile-CI --platform=windows/amd64 -t orchardproject/orchardcore-cms-windows:latest -t orchardproject/orchardcore-cms-windows:${{ steps.get_version.outputs.VERSION }} --push .

  native-assets:
    if: github.repository == 'OrchardCMS/OrchardCore'
    needs: test
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: pomi-*
        path: artifacts
    - name: Publish native release archives and checksums
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      shell: bash
      run: |
        set -euo pipefail
        mapfile -d '' assets < <(find artifacts -type f \( -name 'pomi-*.tar.gz' -o -name 'pomi-*.zip' -o -name 'pomi-*.sha256' \) -print0)
        test "${#assets[@]}" -eq 12
        if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${flags[@]}"
        fi
        gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
