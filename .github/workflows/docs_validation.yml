name: Validating Building the Documentation

on:
  # Run it on main and release pushes too, in case we merge from a branch that's not up-to-date with the target branch
  # and breaks something after merge (or if we push to main).
  push:
    paths:
      - 'mkdocs.yml'
      - 'src/docs/**'
      - '.agents/skills/**'
      - '.agents/plugins/**'
      - '.claude-plugin/**'
      - '.scripts/remote-management/**'
      - 'design/artifacts/logos/pomi/**'
      - '.readthedocs.yml'
      - '.gitattributes'
      - '.github/workflows/docs_validation.yml'
    branches: [ main, release/** ]
  pull_request:
    paths:
      - 'mkdocs.yml'
      - 'src/docs/**'
      - '.agents/skills/**'
      - '.agents/plugins/**'
      - '.claude-plugin/**'
      - '.scripts/remote-management/**'
      - 'design/artifacts/logos/pomi/**'
      - '.readthedocs.yml'
      - '.gitattributes'
      - '.github/workflows/docs_validation.yml'

concurrency:
  group: ${{ github.head_ref || github.run_id }}-docs_validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-building-documentation:
    name: Validating Building the Documentation
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Necessary to avoid mkdocs-git-revision-date-localized-plugin warnings.
        fetch-depth: 0

    - name: Install Dependencies
      run: |
        pip install -r src/docs/requirements.txt -v

    - name: Validate directly installable Pomi marketplace
      run: python .scripts/remote-management/test-marketplace.py

    - name: Build Documentation
      run: python -m mkdocs build --strict

    - name: Validate published Pomi packages and raw skills
      run: python .scripts/remote-management/test-skill-distribution.py site

    - name: Upload Pomi downloads for this commit
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: pomi-skills-${{ github.sha }}
        path: site/downloads/
        if-no-files-found: error
