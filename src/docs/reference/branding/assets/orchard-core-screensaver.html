<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Orchard Core Screensaver with Countdown</title>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #c6c6c6;
            }
            #logo {
                position: absolute;
                top: 0;
                left: 0;
                width: 15vw;
                max-width: 20vw;
                z-index: 0;
                will-change: transform;
                user-select: none;
                pointer-events: none;
            }
            #countdown {
                position: fixed;
                top: 50%;
                left: 50%;
                z-index: 1;
                display: none;
                color: #404041;
                font: 700 clamp(5rem, 20vw, 20rem) / 1 system-ui, sans-serif;
                pointer-events: none;
                transform: translate(-50%, -50%);
                user-select: none;
            }
            #countdown.blinking {
                animation: blink 1s step-end infinite;
            }
            #timerDialog {
                color: #404041;
                border: 0;
                border-radius: 0.75rem;
                padding: 1.5rem;
                font: 1rem system-ui, sans-serif;
            }
            #timerDialog::backdrop {
                background: rgb(0 0 0 / 25%);
            }
            .timer-form {
                display: grid;
                gap: 1rem;
                min-width: 16rem;
            }
            .timer-actions {
                display: flex;
                gap: 0.5rem;
                justify-content: flex-end;
            }
            @keyframes blink {
                50% {
                    opacity: 0;
                }
            }
        </style>
    </head>

        <div id="countdown" aria-live="polite"></div>

        <dialog id="timerDialog">
            <form class="timer-form" method="dialog">
                <label for="timerInput">Countdown target time</label>
                <input id="timerInput" type="time" required>
                <div class="timer-actions">
                    <button id="clearTimer" type="button">Clear</button>
                    <button id="cancelTimer" type="button">Cancel</button>
                    <button id="saveTimer" type="submit" value="save">Save</button>
                </div>
            </form>
        </dialog>

        <script>
            const logo = document.getElementById('logo');
            const countdown = document.getElementById('countdown');
            const timerDialog = document.getElementById('timerDialog');
            const timerForm = timerDialog.querySelector('form');
            const timerInput = document.getElementById('timerInput');
            const clearTimer = document.getElementById('clearTimer');
            const cancelTimer = document.getElementById('cancelTimer');

            let x = 0, y = 0;
            let vx = 2, vy = 2;
            const speed = 2;
            let countdownTarget = null;
            let countdownInterval = null;

            function getLogoSize() {
                const rect = logo.getBoundingClientRect();
                return { w: rect.width, h: rect.height };
            }

            function clampPosition() {
                const { w, h } = getLogoSize();
                const maxX = window.innerWidth - w;
                const maxY = window.innerHeight - h;
                if (x > maxX) x = maxX;
                if (y > maxY) y = maxY;
                if (x < 0) x = 0;
                if (y < 0) y = 0;
            }

            // Initialize position roughly centered
            function init() {
                const { w, h } = getLogoSize();
                x = (window.innerWidth - w) / 2;
                y = (window.innerHeight - h) / 2;
                vx = speed;
                vy = speed;
                logo.style.transform = `translate(${x}px, ${y}px)`;
            }

            function tick() {
                const { w, h } = getLogoSize();
                const maxX = window.innerWidth - w;
                const maxY = window.innerHeight - h;

                x += vx;
                y += vy;

                if (x <= 0) {
                    x = 0;
                    vx = Math.abs(vx);
                } else if (x >= maxX) {
                    x = maxX;
                    vx = -Math.abs(vx);
                }

                if (y <= 0) {
                    y = 0;
                    vy = Math.abs(vy);
                } else if (y >= maxY) {
                    y = maxY;
                    vy = -Math.abs(vy);
                }

                logo.style.transform = `translate(${x}px, ${y}px)`;
                requestAnimationFrame(tick);
            }

            window.addEventListener('resize', clampPosition);

            function formatDuration(totalSeconds) {
                const hours = Math.floor(totalSeconds / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const seconds = totalSeconds % 60;
                const twoDigits = value => String(value).padStart(2, '0');

                if (hours > 0) {
                    return `${twoDigits(hours)}:${twoDigits(minutes)}:${twoDigits(seconds)}`;
                }

                return `${twoDigits(minutes)}:${twoDigits(seconds)}`;
            }

            function getTargetTime(timeValue) {
                const [hours, minutes] = timeValue.split(':').map(Number);
                const target = new Date();
                target.setHours(hours, minutes, 0, 0);
                return target;
            }

            function updateCountdown() {
                const remainingSeconds = Math.max(
                    0,
                    Math.ceil((countdownTarget.getTime() - Date.now()) / 1000)
                );

                countdown.textContent = remainingSeconds === 0
                    ? '00:00'
                    : formatDuration(remainingSeconds);

                countdown.classList.toggle('blinking', remainingSeconds === 0);
            }

            function startCountdown(timeValue) {
                countdownTarget = getTargetTime(timeValue);
                countdown.style.display = 'block';
                clearInterval(countdownInterval);
                updateCountdown();
                countdownInterval = setInterval(updateCountdown, 1000);
            }

            function clearCountdown() {
                clearInterval(countdownInterval);
                countdownInterval = null;
                countdownTarget = null;
                countdown.textContent = '';
                countdown.style.display = 'none';
                countdown.classList.remove('blinking');
                timerDialog.close();
            }

            function openTimerDialog() {
                timerInput.value = countdownTarget
                    ? `${String(countdownTarget.getHours()).padStart(2, '0')}:${String(countdownTarget.getMinutes()).padStart(2, '0')}`
                    : '';
                timerDialog.showModal();
                timerInput.focus();
            }

            document.body.addEventListener('dblclick', event => {
                if (!timerDialog.open && event.target !== timerDialog) {
                    openTimerDialog();
                }
            });

            timerForm.addEventListener('submit', event => {
                event.preventDefault();

                if (!timerInput.reportValidity()) {
                    return;
                }

                startCountdown(timerInput.value);
                timerDialog.close();
            });

            clearTimer.addEventListener('click', clearCountdown);
            cancelTimer.addEventListener('click', () => timerDialog.close());

            let started = false;
            function start() {
                if (started) return;
                started = true;
                init();
                requestAnimationFrame(tick);
            }

            logo.addEventListener('load', start);

            // Fallback in case the image is already loaded (e.g. embedded data URI)
            if (logo.complete) {
                start();
            }
        </script>
